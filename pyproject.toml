[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mrfhelper"
version = "2.6.0"
description = "Generate OpenSees models for moment-resisting frame analysis"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Wenchen Lie", email = "438171766@qq.com" },
]
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "wsection",
]

[tool.setuptools.packages.find]
include = ["MRFHelper*", "subroutines*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["subroutines"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "N"]

[tool.ruff.lint.per-file-ignores]
"MRFHelper/__init__.py" = ["N999"]
"MRFHelper/building_geometry.py" = ["N802"]
"MRFHelper/connection_and_boundary.py" = ["N802"]
"MRFHelper/load_and_material.py" = ["N802"]
"MRFHelper/mrf_helper.py" = ["N802"]
"MRFHelper/structural_components.py" = ["N802"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
